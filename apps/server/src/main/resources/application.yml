spring:
  application:
    name: live-republic-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/liverepublic}
    username: ${DATABASE_USERNAME:liverepublic}
    password: ${DATABASE_PASSWORD:liverepublic}
  jpa:
    # Schema는 Flyway Migration으로만 변경한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    # 방송(최대 수 시간) 중 상호작용이 없어도 종료 요청이 실패하지 않도록 여유를 둔다.
    # (기본 30분이면 장시간 방송 후 종료가 401이 된다 — heartbeat·재인증 정교화는 후속 티켓)
    timeout: 12h
    jdbc:
      initialize-schema: always
  web:
    error:
      # 오류 응답의 message는 서버가 작성한 사용자 안내문이다. 화면이 그대로 표시한다.
      include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}
  # Fly Proxy 뒤에서 https 여부와 클라이언트 정보를 올바르게 판정한다.
  forward-headers-strategy: framework

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,https://*.vercel.app}
