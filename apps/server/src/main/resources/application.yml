spring:
  application:
    name: live-republic-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/liverepublic}
    username: ${DATABASE_USERNAME:liverepublic}
    password: ${DATABASE_PASSWORD:liverepublic}
  jpa:
    # Schema는 Flyway Migration으로만 변경한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${PORT:8080}

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,https://*.vercel.app}
