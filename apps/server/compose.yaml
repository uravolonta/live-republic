# 로컬 개발용 PostgreSQL. Preview/Demo는 Neon을 사용한다 (ADR-002).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: liverepublic
      POSTGRES_USER: liverepublic
      POSTGRES_PASSWORD: liverepublic
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
