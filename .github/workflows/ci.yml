name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: Server (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build

  owner-web:
    name: Owner Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/owner-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/owner-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  customer-web:
    name: Customer Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/customer-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  streamer-android:
    name: Streamer App (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/streamer-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
